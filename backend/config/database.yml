# Food24KH PostgreSQL configuration
# Prefer DATABASE_URL when set. Never commit real credentials.

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "food24kh_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME_TEST", "food24kh_test") %>

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    database: food24kh_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: food24kh_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: food24kh_production_cable
    migrations_paths: db/cable_migrate
